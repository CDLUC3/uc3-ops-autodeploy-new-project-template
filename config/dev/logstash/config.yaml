---
# dev/logstash/config.yaml
#
sceptre_user_data:
  # Prereqs
  codebuild_loggroup: !stack_output dev/prereqs.yaml::CodeBuildLogGroup
  lambda_loggroup: !stack_output dev/prereqs.yaml::LambdaFunctionLogGroup
  codebuild_role: !stack_output dev/prereqs.yaml::CodeBuildRole
  codepipeline_role_arn: !stack_output dev/prereqs.yaml::CodePipelineRoleArn
  lambda_role_arn: !stack_output dev/prereqs.yaml::LambdaFunctionExecRoleArn
  scheduler_role_arn: !stack_output dev/prereqs.yaml::SchedulerServiceRoleArn

  source_repository: CDLUC3/uc3-ops-logstash-docker-image
  source_branch: autodeploy

  ssm_path: !join
      - '/'
      - - {{ sceptre_user_data.ssm_base_path }}
        - logstash
        - {{ sceptre_user_data.environment }}
        - release

