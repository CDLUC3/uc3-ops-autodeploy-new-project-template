---
# dev/logstash/lambda.yaml
template:
  path: lambda.yaml.j2

sceptre_user_data:
  ecs_cluster: !stack_output_external uc3-ops-ecs-dev-cluster::EcsFargateCluster
  ecs_service_name: !stack_output_external uc3-ops-logstash-dev-ecs-demo::EcsServiceName
  issue_service_restart: true
  scheduler_expression: 'rate(1 day)'
  #scheduler_expression: 'rate(20 minutes)'
  scheduler_state: ENABLED

